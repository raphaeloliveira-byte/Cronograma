<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14211F;
    --surface: #1C2E2B;
    --surface-2: #223832;
    --text: #F0EDE4;
    --text-dim: #93A69E;
    --accent: #E8A33D;
    --accent-dim: #7A5A2A;
    --good: #6FA98C;
    --good-dim: #2E4A3D;
    --pending: #A66A4E;
    --border: #2C443E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:32px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:520px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .countdown{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:28px;
  }
  .countdown strong{ color:var(--text); font-weight:600; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .progress-label{ font-size:13px; color:var(--text-dim); }
  .progress-value{ font-family:'IBM Plex Mono', monospace; font-size:15px; }
  .progress-value b{ color:var(--good); font-weight:500; }
  .bar-track{
    height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;
  }
  .bar-fill{
    height:100%; background:linear-gradient(90deg, var(--good-dim), var(--good));
    border-radius:4px; transition:width .4s ease;
  }

  .section-title{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 14px;
  }

  .task-list{ display:flex; flex-direction:column; gap:2px; }
  .day-group{ margin-bottom:14px; }
  .day-group:last-child{ margin-bottom:0; }
  .day-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
  }
  .day-heading .tag{
    font-size:10px;
    padding:1px 6px;
    border-radius:10px;
    background:var(--surface-2);
  }
  .day-heading .tag.future{ color:var(--text-dim); }
  .day-heading .tag.today{ color:var(--accent); background:rgba(232,163,61,0.12); }

  .task-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
  }
  .task-check{
    flex:none;
    width:20px; height:20px;
    border-radius:6px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }
  .task-check.done{
    background:var(--good);
    border-color:var(--good);
  }
  .task-check.done::after{
    content:'✓';
    color:#0F1E16;
    font-size:13px;
    font-weight:700;
  }
  .task-text{
    flex:1;
    font-size:14px;
    line-height:1.4;
  }
  .task-text.done{ color:var(--text-dim); text-decoration:line-through; }

  .hint{ font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5; }
  .empty{ color:var(--text-dim); font-size:13px; text-align:center; padding:20px 0; }
  .live-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--good); margin-right:6px; vertical-align:middle;
  }
  .status-line{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:18px; }

  ::selection{ background:var(--accent-dim); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty">Carregando...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Preencha com os dados do seu projeto (Supabase > Settings > API).
const SUPABASE_URL = 'https://kftcgniqfwlkxmgrychy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QpJiGfVXO2kl3LGYEq3hiQ_QKB0wUWy';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { config: null, tasks: [] };

function todayStr(){ return new Date().toISOString().slice(0,10); }

function daysUntil(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target - now) / 86400000);
}

function formatDayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  const app = document.getElementById('app');
  if(!state.config){
    app.innerHTML = `
      <div class="eyebrow">Sprint de Estudos</div>
      <h1>Ainda sem cronograma</h1>
      <div class="empty">A prova ainda não foi configurada.</div>
    `;
    return;
  }

  const { config, tasks } = state;
  const dias = daysUntil(config.examDate);
  const diasTexto = dias > 0
    ? `<strong>${dias}</strong> dia${dias===1?'':'s'} até a prova`
    : (dias === 0 ? `<strong>é hoje!</strong>` : `a prova foi há <strong>${Math.abs(dias)}</strong> dia${Math.abs(dias)===1?'':'s'}`);

  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  const byDate = {};
  tasks.forEach(t => {
    if(!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });
  const dates = Object.keys(byDate).sort();
  const today = todayStr();

  const listHtml = dates.length === 0
    ? `<div class="empty">Nenhum item ainda.</div>`
    : dates.map(date => {
        const items = byDate[date];
        const tagClass = date === today ? 'today' : (date > today ? 'future' : '');
        const tagLabel = date === today ? 'hoje' : (date > today ? 'planejado' : '');
        return `
          <div class="day-group">
            <div class="day-heading">
              <span>${formatDayLabel(date)}</span>
              ${tagLabel ? `<span class="tag ${tagClass}">${tagLabel}</span>` : ''}
            </div>
            <div class="task-list">
              ${items.map(t => `
                <div class="task-item">
                  <div class="task-check ${t.done ? 'done' : ''}"></div>
                  <div class="task-text ${t.done ? 'done' : ''}">${escapeHtml(t.description)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

  app.innerHTML = `
    <div class="eyebrow">Sprint de Estudos</div>
    <h1>${escapeHtml(config.examName)}</h1>
    <div class="countdown">${diasTexto}</div>

    <div class="card">
      <div class="progress-row">
        <span class="progress-label">Progresso</span>
        <span class="progress-value"><b>${done}</b> / ${total} concluídos</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card">
      <div class="section-title">Dias</div>
      ${listHtml}
    </div>

    <div class="status-line"><span class="live-dot"></span>Atualiza automaticamente</div>
  `;
}

async function load(){
  const { data, error } = await sb
    .from('cronograma_state')
    .select('config,tasks')
    .eq('id', 1)
    .single();
  if(!error && data){
    state = { config: data.config, tasks: data.tasks || [] };
  }
  render();
}

sb.channel('cronograma_state_public')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_state', filter: 'id=eq.1' }, (payload) => {
    if(payload.new){
      state = { config: payload.new.config, tasks: payload.new.tasks || [] };
      render();
    }
  })
  .subscribe();

load();
</script>
</body>
</html>
