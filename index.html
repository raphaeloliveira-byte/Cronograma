<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14211F;
    --surface: #1C2E2B;
    --surface-2: #223832;
    --text: #F0EDE4;
    --text-dim: #93A69E;
    --accent: #E8A33D;
    --accent-dim: #7A5A2A;
    --good: #6FA98C;
    --good-dim: #2E4A3D;
    --pending: #A66A4E;
    --pending-dim: #3E2E25;
    --border: #2C443E;
    --gold: #D4AF37;
    --gold-dim: rgba(212,175,55,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:32px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:520px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .countdown{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:28px;
  }
  .countdown strong{ color:var(--text); font-weight:600; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .progress-label{ font-size:13px; color:var(--text-dim); }
  .progress-value{ font-family:'IBM Plex Mono', monospace; font-size:15px; }
  .progress-value b{ color:var(--good); font-weight:500; }
  .bar-track{
    height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;
  }
  .bar-fill{
    height:100%; background:linear-gradient(90deg, var(--good-dim), var(--good));
    border-radius:4px; transition:width .4s ease;
  }

  .section-title{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 14px;
  }

  .task-list{ display:flex; flex-direction:column; gap:2px; }

  .cal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav button{
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
    border-radius:8px; padding:4px 10px; font-size:13px; font-weight:600; line-height:1;
  }
  .cal-nav button:hover{ color:var(--text); border-color:var(--text-dim); }
  .cal-month-label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--text); min-width:118px; text-align:center;
  }
  .cal-legend{ display:flex; gap:10px; font-size:10px; color:var(--text-dim); }
  .cal-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.good{ background:var(--good); }
  .dot.mid{ background:var(--accent); }
  .dot.pend{ background:var(--pending); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; font-family:'IBM Plex Mono', monospace; }
  .cal-dow{ font-size:9px; color:var(--text-dim); text-align:center; padding-bottom:4px; letter-spacing:0.04em; }
  .cal-cell{
    aspect-ratio:1; border-radius:7px; border:1px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:12px; gap:2px; background:var(--surface-2); color:var(--text-dim);
    cursor:pointer;
  }
  .cal-cell.pad{ background:transparent; border:none; cursor:default; }
  .cal-cell.done{ background:var(--good-dim); color:var(--text); border-color:var(--good); }
  .cal-cell.partial{ background:rgba(232,163,61,0.14); color:var(--text); border-color:var(--accent); }
  .cal-cell.pending{ background:var(--pending-dim); color:var(--text); border-color:var(--pending); }
  .cal-cell.today{ box-shadow:0 0 0 2px var(--accent) inset; }
  .cal-cell.selected{ outline:2px solid var(--text); outline-offset:1px; }
  .cal-cell.exam-passed{
    background:var(--gold-dim); color:var(--text); border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold), 0 0 12px rgba(212,175,55,0.3);
  }
  .cal-cell.exam-passed.selected{ outline-color:var(--gold); }
  .cal-cell.exam-passed .n{ color:var(--gold); font-weight:600; }
  .cal-cell .n{ font-weight:500; }
  .cal-cell .c{ font-size:8.5px; opacity:0.85; }
  .cal-cell .party{ font-size:11px; line-height:1; }

  .day-detail{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .day-detail-label{
    font-size:11px; color:var(--text-dim); margin-bottom:4px;
    font-family:'IBM Plex Mono', monospace; letter-spacing:0.04em; text-transform:uppercase;
  }

  .task-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
  }
  .task-check{
    flex:none;
    width:20px; height:20px;
    border-radius:6px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }
  .task-check.done{
    background:var(--good);
    border-color:var(--good);
  }
  .task-check.done::after{
    content:'✓';
    color:#0F1E16;
    font-size:13px;
    font-weight:700;
  }
  .task-body{ flex:1; min-width:0; }
  .task-text{
    font-size:14px;
    line-height:1.4;
  }
  .task-text.done{ color:var(--text); }
  .task-meta{
    display:flex; gap:8px; align-items:center; margin-top:4px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim);
  }
  .pct-badge{ padding:1px 7px; border-radius:8px; background:var(--surface-2); }
  .pct-badge.good{ color:var(--good); }
  .pct-badge.mid{ color:var(--accent); }
  .pct-badge.pend{ color:var(--pending); }
  .task-thumb{
    flex:none; width:40px; height:40px; object-fit:cover;
    border-radius:6px; border:1px solid var(--border); cursor:zoom-in;
  }
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(10,16,15,0.88);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:1000; cursor:zoom-out;
  }
  .lightbox-overlay img{
    max-width:100%; max-height:100%; border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }

  .hint{ font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5; }
  .empty{ color:var(--text-dim); font-size:13px; text-align:center; padding:20px 0; }
  .live-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--good); margin-right:6px; vertical-align:middle;
  }
  .status-line{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:18px; }

  ::selection{ background:var(--accent-dim); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty">Carregando...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Preencha com os dados do seu projeto (Supabase > Settings > API).
const SUPABASE_URL = 'https://kftcgniqfwlkxmgrychy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QpJiGfVXO2kl3LGYEq3hiQ_QKB0wUWy';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { config: null, tasks: [] };
let calView = null;
let selectedDate = todayStr();

const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW_PT = ['D','S','T','Q','Q','S','S'];

function todayStr(){ return new Date().toISOString().slice(0,10); }

function pad2(n){ return String(n).padStart(2,'0'); }

function daysUntil(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target - now) / 86400000);
}

function formatDayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function dayStatus(items){
  if(!items || items.length === 0) return null;
  const done = items.filter(t => t.done).length;
  if(done === items.length) return 'done';
  if(done === 0) return 'pending';
  return 'partial';
}

function isExamTask(t){
  return (t.description || '').trim().toLowerCase() === 'prova';
}

function pctColorClass(pct){
  if(pct >= 80) return 'good';
  if(pct >= 40) return 'mid';
  return 'pend';
}

function openLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${src}" alt="Anexo ampliado">`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

function render(){
  const app = document.getElementById('app');
  if(!state.config){
    app.innerHTML = `
      <div class="eyebrow">Sprint de Estudos</div>
      <h1>Ainda sem cronograma</h1>
      <div class="empty">A prova ainda não foi configurada.</div>
    `;
    return;
  }

  const { config, tasks } = state;
  const dias = daysUntil(config.examDate);
  const diasTexto = dias > 0
    ? `<strong>${dias}</strong> dia${dias===1?'':'s'} até a prova`
    : (dias === 0 ? `<strong>é hoje!</strong>` : `a prova foi há <strong>${Math.abs(dias)}</strong> dia${Math.abs(dias)===1?'':'s'}`);

  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  const byDate = {};
  tasks.forEach(t => {
    if(!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });
  const today = todayStr();

  if(!calView) calView = { year: new Date().getFullYear(), month: new Date().getMonth() };

  const firstWeekday = new Date(calView.year, calView.month, 1).getDay();
  const daysInMonth = new Date(calView.year, calView.month + 1, 0).getDate();

  let cells = DOW_PT.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for(let i = 0; i < firstWeekday; i++){
    cells += `<div class="cal-cell pad"></div>`;
  }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${calView.year}-${pad2(calView.month + 1)}-${pad2(d)}`;
    const items = byDate[dateStr] || [];
    const status = dayStatus(items);
    const classes = ['cal-cell'];
    if(status) classes.push(status);
    if(dateStr === today) classes.push('today');
    if(dateStr === selectedDate) classes.push('selected');
    const examPassed = items.some(t => t.done && isExamTask(t));
    if(examPassed) classes.push('exam-passed');
    const countLabel = items.length ? `${items.filter(t => t.done).length}/${items.length}` : '';
    const badge = examPassed
      ? `<span class="party" title="Aprovado!">🎉</span>`
      : (countLabel ? `<span class="c">${countLabel}</span>` : '');
    cells += `<div class="${classes.join(' ')}" data-date="${dateStr}"><span class="n">${d}</span>${badge}</div>`;
  }

  const selectedItems = selectedDate ? (byDate[selectedDate] || []) : [];
  const selectedLabel = selectedDate
    ? (selectedDate === today ? `${formatDayLabel(selectedDate)} · hoje` : formatDayLabel(selectedDate))
    : '';

  const detailHtml = !selectedDate
    ? `<div class="empty">Toque num dia para ver os itens.</div>`
    : selectedItems.length === 0
      ? `<div class="empty">Nenhum item nesse dia.</div>`
      : `<div class="task-list">${selectedItems.map(t => `
          <div class="task-item">
            <div class="task-check ${t.done ? 'done' : ''}"></div>
            <div class="task-body">
              <div class="task-text ${t.done ? 'done' : ''}">${escapeHtml(t.description)}</div>
              ${(t.hours != null || t.pct != null) ? `
                <div class="task-meta">
                  ${t.hours != null ? `<span>${t.hours}h estudadas</span>` : ''}
                  ${t.pct != null ? `<span class="pct-badge ${pctColorClass(t.pct)}">${t.pct}% de acerto</span>` : ''}
                </div>
              ` : ''}
            </div>
            ${t.image ? `<img class="task-thumb" src="${t.image}" alt="Anexo do item">` : ''}
          </div>
        `).join('')}</div>`;

  app.innerHTML = `
    <div class="eyebrow">Sprint de Estudos</div>
    <h1>${escapeHtml(config.examName)}</h1>
    <div class="countdown">${diasTexto}</div>

    <div class="card">
      <div class="progress-row">
        <span class="progress-label">Progresso</span>
        <span class="progress-value"><b>${done}</b> / ${total} concluídos</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card">
      <div class="cal-head">
        <div class="cal-nav">
          <button id="prevMonth" type="button" aria-label="Mês anterior">‹</button>
          <span class="cal-month-label">${MONTHS_PT[calView.month]} ${calView.year}</span>
          <button id="nextMonth" type="button" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal-legend">
          <span><i class="dot good"></i>completo</span>
          <span><i class="dot mid"></i>parcial</span>
          <span><i class="dot pend"></i>pendente</span>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>

      <div class="day-detail">
        <div class="day-detail-label">${selectedLabel || 'Dia'}</div>
        ${detailHtml}
      </div>
    </div>

    <div class="status-line"><span class="live-dot"></span>Atualiza automaticamente</div>
  `;

  document.getElementById('prevMonth').onclick = () => {
    calView.month -= 1;
    if(calView.month < 0){ calView.month = 11; calView.year -= 1; }
    selectedDate = null;
    render();
  };
  document.getElementById('nextMonth').onclick = () => {
    calView.month += 1;
    if(calView.month > 11){ calView.month = 0; calView.year += 1; }
    selectedDate = null;
    render();
  };
  app.querySelectorAll('.cal-cell[data-date]').forEach(el => {
    el.onclick = () => {
      selectedDate = el.getAttribute('data-date');
      render();
    };
  });

  app.querySelectorAll('.task-thumb').forEach(img => {
    img.onclick = () => openLightbox(img.src);
  });
}

async function load(){
  const { data, error } = await sb
    .from('cronograma_state')
    .select('config,tasks')
    .eq('id', 1)
    .single();
  if(!error && data){
    state = { config: data.config, tasks: data.tasks || [] };
  }
  render();
}

sb.channel('cronograma_state_public')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_state', filter: 'id=eq.1' }, (payload) => {
    if(payload.new){
      state = { config: payload.new.config, tasks: payload.new.tasks || [] };
      render();
    }
  })
  .subscribe();

load();
</script>
</body>
</html>
