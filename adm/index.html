<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint de Estudos — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14211F;
    --surface: #1C2E2B;
    --surface-2: #223832;
    --text: #F0EDE4;
    --text-dim: #93A69E;
    --text-soft: #C6D3CD;
    --accent: #E8A33D;
    --accent-dim: #7A5A2A;
    --good: #6FA98C;
    --good-dim: #2E4A3D;
    --pending: #A66A4E;
    --pending-dim: #3E2E25;
    --border: #2C443E;
    --gold: #D4AF37;
    --gold-dim: rgba(212,175,55,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:32px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:520px; }
  .wrap.wide{ max-width:760px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .countdown{
    color:var(--text-soft);
    font-size:14px;
    margin-bottom:28px;
  }
  .countdown strong{ color:var(--text); font-weight:600; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .progress-label{ font-size:13px; color:var(--text-soft); }
  .progress-value{ font-family:'IBM Plex Mono', monospace; font-size:15px; }
  .progress-value b{ color:var(--good); font-weight:500; }
  .bar-track{
    height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;
  }
  .bar-fill{
    height:100%; background:linear-gradient(90deg, var(--good-dim), var(--good));
    border-radius:4px; transition:width .4s ease;
  }

  .field label{
    display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:6px;
  }
  .field{ margin-bottom:12px; }
  input[type=date], input[type=text], input[type=password], input[type=number], select, textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    width:100%;
  }
  textarea{ resize:vertical; line-height:1.45; min-height:72px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  input[type=file]{
    color:var(--text-dim);
    font-size:12.5px;
    width:100%;
  }
  .image-preview{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  button{
    background:var(--accent);
    color:#1A1408;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
    font-family:'IBM Plex Sans', sans-serif;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  button.ghost{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--border);
    font-weight:500;
  }
  button.ghost:hover{ color:var(--text); border-color:var(--text-dim); }

  .section-title{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
    margin:0 0 14px;
  }

  .task-list{ display:flex; flex-direction:column; gap:2px; }

  .cal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav button{
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
    border-radius:8px; padding:4px 10px; font-size:13px; font-weight:600; line-height:1;
  }
  .cal-nav button:hover{ color:var(--text); border-color:var(--text-dim); }
  .cal-month-label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--text); min-width:118px; text-align:center;
  }
  .cal-legend{ display:flex; gap:10px; font-size:10px; color:var(--text-soft); }
  .cal-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.good{ background:var(--good); }
  .dot.mid{ background:var(--accent); }
  .dot.pend{ background:var(--pending); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; font-family:'IBM Plex Mono', monospace; }
  .cal-dow{ font-size:9.5px; color:var(--text-soft); text-align:center; padding-bottom:4px; letter-spacing:0.04em; }
  .cal-cell{
    aspect-ratio:1; border-radius:7px; border:1px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:12px; gap:2px; background:var(--surface-2); color:var(--text-dim);
    cursor:pointer;
  }
  .cal-cell.pad{ background:transparent; border:none; cursor:default; }
  .cal-cell.done{ background:var(--good-dim); color:var(--text); border-color:var(--good); }
  .cal-cell.partial{ background:rgba(232,163,61,0.14); color:var(--text); border-color:var(--accent); }
  .cal-cell.pending{ background:var(--pending-dim); color:var(--text); border-color:var(--pending); }
  .cal-cell.today{ box-shadow:0 0 0 2px var(--accent) inset; }
  .cal-cell.selected{ outline:2px solid var(--text); outline-offset:1px; }
  .cal-cell.exam-passed{
    background:var(--gold-dim); color:var(--text); border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold), 0 0 12px rgba(212,175,55,0.3);
  }
  .cal-cell.exam-passed.selected{ outline-color:var(--gold); }
  .cal-cell.exam-passed .n{ color:var(--gold); font-weight:600; }
  .cal-cell .n{ font-weight:500; }
  .cal-cell .c{ font-size:8.5px; opacity:0.85; }
  .cal-cell .party{ font-size:11px; line-height:1; }

  .day-detail{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .day-detail-label{
    font-size:11.5px; color:var(--text); font-weight:600; margin-bottom:4px;
    font-family:'IBM Plex Mono', monospace; letter-spacing:0.04em; text-transform:uppercase;
  }

  .task-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
  }
  .task-check{
    flex:none;
    width:20px; height:20px;
    border-radius:6px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
    transition:all .15s ease;
  }
  .task-check.done{
    background:var(--good);
    border-color:var(--good);
  }
  .task-check.done::after{
    content:'✓';
    color:#0F1E16;
    font-size:13px;
    font-weight:700;
  }
  .task-body{ flex:1; min-width:0; }
  .task-text{
    font-size:14px;
    line-height:1.4;
  }
  .task-text.done{ color:var(--text); }
  .task-meta{
    display:flex; gap:8px; align-items:center; margin-top:4px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-soft);
  }
  .pct-badge{ padding:1px 7px; border-radius:8px; background:var(--surface-2); }
  .pct-badge.good{ color:var(--good); }
  .pct-badge.mid{ color:var(--accent); }
  .pct-badge.pend{ color:var(--pending); }
  .task-thumb{
    flex:none; width:40px; height:40px; object-fit:cover;
    border-radius:6px; border:1px solid var(--border); cursor:zoom-in;
  }
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(10,16,15,0.88);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:1000; cursor:zoom-out;
  }
  .lightbox-overlay img{
    max-width:100%; max-height:100%; border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }
  .task-edit, .task-remove{
    flex:none;
    background:none; border:none;
    color:var(--text-dim);
    font-size:14px;
    line-height:1;
    padding:2px 4px;
    cursor:pointer;
  }
  .task-remove{ font-size:16px; }
  .task-edit:hover{ color:var(--accent); }
  .task-remove:hover{ color:var(--pending); }

  .settings-toggle{
    background:none; border:none; color:var(--text-dim); font-size:12px;
    cursor:pointer; text-decoration:underline; padding:0; margin-top:4px;
  }
  .settings-toggle:hover{ color:var(--text); }

  .setup{ display:flex; flex-direction:column; gap:12px; }
  .hint{ font-size:12px; color:var(--text-soft); margin-top:10px; line-height:1.5; }
  .empty{ color:var(--text-soft); font-size:13px; text-align:center; padding:20px 0; }
  .error{ color:var(--pending); font-size:12px; margin-top:8px; }
  .badge-adm{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#1A1408;
    background:var(--accent);
    border-radius:10px;
    padding:2px 8px;
    margin-bottom:12px;
  }

  /* ---------------- PDI ---------------- */
  .tabs{ display:flex; gap:4px; margin:0 0 24px; border-bottom:1px solid var(--border); }
  .tabs button{
    background:none; border:none; border-bottom:2px solid transparent; border-radius:0;
    color:var(--text-soft); font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; font-weight:500;
    padding:9px 12px; cursor:pointer;
  }
  .tabs button:hover{ color:var(--text); filter:none; }
  .tabs button.active{ color:var(--accent); border-bottom-color:var(--accent); }

  .pdi-point{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:20px; margin-bottom:18px;
  }
  .pdi-point-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .pdi-point.collapsed .pdi-point-head{ margin-bottom:0; }
  .pdi-point-title-line{
    display:flex; align-items:baseline; gap:10px;
    flex:1; min-width:0; cursor:pointer;
  }
  .pdi-point-preview{
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:400;
    color:var(--text-soft); text-transform:none; letter-spacing:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .pdi-icon-btn.chev{
    font-size:12px; color:var(--text-soft); width:22px;
    display:flex; align-items:center; justify-content:center;
  }
  .pdi-icon-btn.chev:hover{ color:var(--accent); }
  .pdi-point-label{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--text); font-weight:600;
  }

  .pdi-block{ border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:16px; }
  .pdi-block.good{ border-color:var(--good); background:rgba(111,169,140,0.06); }
  .pdi-block.accent{ border-color:var(--accent); background:rgba(232,163,61,0.06); }
  .pdi-block.pending{ border-color:var(--pending); background:rgba(166,106,78,0.07); }
  .pdi-block-title{ font-size:15px; font-weight:700; letter-spacing:-0.01em; }
  .pdi-block.good .pdi-block-title{ color:var(--good); }
  .pdi-block.accent .pdi-block-title{ color:var(--accent); }
  .pdi-block.pending .pdi-block-title{ color:var(--pending); }
  .pdi-block-sub{ font-size:12px; color:var(--text-soft); margin:3px 0 14px; line-height:1.4; }

  .pdi-sub-label{
    display:block; font-size:12.5px; font-weight:600;
    color:var(--text); margin-bottom:7px;
  }
  .pdi-item-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .pdi-item-row input[type=text]{ flex:1; min-width:0; }
  .pdi-item-row input[type=date]{ flex:none; width:158px; }
  .pdi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }

  .pdi-add{
    background:none; border:none; color:var(--good);
    font-size:12.5px; font-weight:500; padding:2px 0 0; cursor:pointer;
  }
  .pdi-add:hover{ filter:none; text-decoration:underline; }
  .pdi-icon-btn{
    flex:none; background:none; border:none; color:var(--text-dim);
    font-size:17px; line-height:1; padding:2px 5px; cursor:pointer;
  }
  .pdi-icon-btn:hover{ color:var(--pending); filter:none; }

  .pdi-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
  .pdi-save-state{ font-size:11.5px; color:var(--text-soft); }
  .pdi-save-state.dirty{ color:var(--accent); }

  .pdi-title-ro{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:15px; line-height:1.45; white-space:pre-wrap;
  }
  .pdi-ro-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .pdi-ro-list li{
    display:flex; gap:10px; align-items:flex-start; justify-content:space-between;
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; font-size:13.5px; line-height:1.45;
  }
  .pdi-date-chip{
    flex:none; font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    color:var(--text-soft); padding-top:2px;
  }
  .pdi-ro-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; font-size:13.5px; line-height:1.5;
    white-space:pre-wrap; min-height:42px;
  }
  .pdi-ro-box.blank{ color:var(--text-soft); }

  @media (max-width:620px){
    .pdi-grid{ grid-template-columns:1fr; }
    .pdi-item-row{ flex-wrap:wrap; }
    .pdi-item-row input[type=date]{ width:100%; }
  }

  ::selection{ background:var(--accent-dim); }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Preencha com os dados do seu projeto (Supabase > Settings > API).
const SUPABASE_URL = 'https://kftcgniqfwlkxmgrychy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QpJiGfVXO2kl3LGYEq3hiQ_QKB0wUWy';
const PASSWORD_STORAGE_KEY = 'cronograma_admin_password';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { config: null, tasks: [], pdi: { points: [] } };
let saving = false;
let calView = null;
let selectedDate = todayStr();
let pendingImageDataUrl = null;
let editingTaskId = null;
let activeTab = 'cronograma';
let pdiDraft = null;
let pdiDirty = false;
let pdiCollapsed = new Set(); // ids dos pontos recolhidos (só visual, não vai pro banco)

const PDI_DEFAULT_POINTS = 4;

const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW_PT = ['D','S','T','Q','Q','S','S'];

const PDI_BLOCKS = [
  { key:'fazendo',   pct:'70%', title:'Aprender fazendo',
    sub:'Projetos, desafios, mudanças de escopo', tone:'good' },
  { key:'outros',    pct:'20%', title:'Aprender com outros',
    sub:'Feedbacks, conversas com referências internas ou acompanhamento direto', tone:'accent' },
  { key:'estudando', pct:'10%', title:'Aprender estudando',
    sub:'Leitura, cursos técnicos ou pesquisas teóricas', tone:'pending' }
];

const PDI_TEXT_FIELDS = [
  { key:'impact',     label:'O que será impactado' },
  { key:'measure',    label:'Como será medido' },
  { key:'conclusion', label:'Conclusão Rapha' },
  { key:'feedback',   label:'Feedbacks recebidos' }
];

function clone(x){ return JSON.parse(JSON.stringify(x)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function pad2(n){ return String(n).padStart(2,'0'); }

function daysUntil(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target - now) / 86400000);
}

function formatDayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Para uso dentro de atributos HTML (escapa também as aspas).
function escapeAttr(str){
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function formatBrDate(dateStr){
  if(!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return (y && m && d) ? `${d}/${m}/${y}` : dateStr;
}

function emptyPdiBlock(){
  return { items: [], impact: '', measure: '', conclusion: '', feedback: '' };
}

function emptyPdiPoint(){
  const blocks = {};
  PDI_BLOCKS.forEach(b => { blocks[b.key] = emptyPdiBlock(); });
  return { id: uid(), title: '', blocks };
}

// Garante que todo ponto tenha os três blocos e os quatro campos de texto,
// mesmo que venha de uma versão anterior do PDI.
function normalizePdi(raw){
  const points = (raw && Array.isArray(raw.points)) ? clone(raw.points) : [];
  points.forEach(pt => {
    if(!pt.id) pt.id = uid();
    if(typeof pt.title !== 'string') pt.title = '';
    if(!pt.blocks || typeof pt.blocks !== 'object') pt.blocks = {};
    PDI_BLOCKS.forEach(b => {
      const blk = pt.blocks[b.key] || {};
      pt.blocks[b.key] = {
        items: Array.isArray(blk.items)
          ? blk.items.map(it => ({ id: it.id || uid(), text: it.text || '', date: it.date || '' }))
          : [],
        impact: blk.impact || '',
        measure: blk.measure || '',
        conclusion: blk.conclusion || '',
        feedback: blk.feedback || ''
      };
    });
  });
  return { points };
}

function pctColorClass(pct){
  if(pct >= 80) return 'good';
  if(pct >= 40) return 'mid';
  return 'pend';
}

function pctOptionsHtml(selectedPct){
  const opts = [['', '—'], ['20','20%'], ['40','40%'], ['60','60%'], ['80','80%'], ['100','100%']];
  return opts.map(([val, label]) => {
    const isSelected = selectedPct != null && String(selectedPct) === val;
    return `<option value="${val}" ${isSelected ? 'selected' : ''}>${label}</option>`;
  }).join('');
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function openLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${src}" alt="Anexo ampliado">`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

function bindThumbs(root){
  root.querySelectorAll('.task-thumb').forEach(img => {
    img.onclick = () => openLightbox(img.src);
  });
}

function updateImagePreview(){
  const wrap = document.getElementById('imagePreviewWrap');
  if(!wrap) return;
  if(pendingImageDataUrl){
    wrap.innerHTML = `<div class="image-preview"><img class="task-thumb" src="${pendingImageDataUrl}" alt="Pré-visualização" /><button type="button" class="settings-toggle" id="removeImageBtn">Remover imagem</button></div>`;
    bindThumbs(wrap);
    document.getElementById('removeImageBtn').onclick = () => {
      pendingImageDataUrl = null;
      const fileInput = document.getElementById('taskImage');
      if(fileInput) fileInput.value = '';
      updateImagePreview();
    };
  } else {
    wrap.innerHTML = '';
  }
}

function dayStatus(items){
  if(!items || items.length === 0) return null;
  const done = items.filter(t => t.done).length;
  if(done === items.length) return 'done';
  if(done === 0) return 'pending';
  return 'partial';
}

function isExamTask(t){
  return (t.description || '').trim().toLowerCase() === 'prova';
}

function getPassword(){
  return localStorage.getItem(PASSWORD_STORAGE_KEY);
}

async function promptPassword(){
  const p = prompt('Senha de admin:');
  if(p){ localStorage.setItem(PASSWORD_STORAGE_KEY, p); }
  return p;
}

async function persist(newConfig, newTasks, errorEl){
  if(saving) return false;
  saving = true;
  let password = getPassword();
  if(!password){ password = await promptPassword(); }
  if(!password){ saving = false; return false; }

  const { error } = await sb.rpc('update_cronograma_state', {
    p_password: password,
    p_config: newConfig,
    p_tasks: newTasks
  });

  saving = false;

  if(error){
    localStorage.removeItem(PASSWORD_STORAGE_KEY);
    if(errorEl) errorEl.textContent = 'Senha incorreta. Tente salvar de novo.';
    else alert('Senha incorreta. Tente de novo.');
    return false;
  }

  state = { config: newConfig, tasks: newTasks, pdi: state.pdi };
  render();
  return true;
}

async function persistPdi(newPdi, errorEl){
  if(saving) return false;
  saving = true;
  let password = getPassword();
  if(!password){ password = await promptPassword(); }
  if(!password){ saving = false; return false; }

  const { error } = await sb.rpc('update_cronograma_pdi', {
    p_password: password,
    p_pdi: newPdi
  });

  saving = false;

  if(error){
    localStorage.removeItem(PASSWORD_STORAGE_KEY);
    if(errorEl) errorEl.textContent = 'Senha incorreta. Tente salvar de novo.';
    else alert('Senha incorreta. Tente de novo.');
    return false;
  }

  state.pdi = clone(newPdi);
  pdiDirty = false;
  render();
  return true;
}

function tabsHtml(){
  const tabs = [['cronograma','Cronograma'], ['pdi','PDI']];
  return `<div class="tabs">${tabs.map(([key, label]) =>
    `<button type="button" data-tab="${key}" class="${activeTab === key ? 'active' : ''}">${label}</button>`
  ).join('')}</div>`;
}

function bindTabs(app){
  app.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => {
      const next = el.getAttribute('data-tab');
      if(next === activeTab) return;
      if(activeTab === 'pdi' && pdiDirty && !confirm('Há alterações do PDI não salvas. Sair mesmo assim?')) return;
      activeTab = next;
      if(next === 'pdi'){ pdiDraft = normalizePdi(state.pdi); pdiDirty = false; }
      render();
    };
  });
}

function render(){
  const app = document.getElementById('app');
  if(!state.config){
    app.className = 'wrap';
    renderSetup(app);
    return;
  }
  app.className = activeTab === 'pdi' ? 'wrap wide' : 'wrap';
  if(activeTab === 'pdi'){
    renderPdi(app);
  } else {
    renderDashboard(app);
  }
}

function renderDashboard(app){
  const { config, tasks } = state;
  const dias = daysUntil(config.examDate);
  const diasTexto = dias > 0
    ? `<strong>${dias}</strong> dia${dias===1?'':'s'} até a prova`
    : (dias === 0 ? `<strong>é hoje!</strong>` : `a prova foi há <strong>${Math.abs(dias)}</strong> dia${Math.abs(dias)===1?'':'s'}`);

  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  const byDate = {};
  tasks.forEach(t => {
    if(!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });
  const today = todayStr();

  if(!calView) calView = { year: new Date().getFullYear(), month: new Date().getMonth() };

  const firstWeekday = new Date(calView.year, calView.month, 1).getDay();
  const daysInMonth = new Date(calView.year, calView.month + 1, 0).getDate();

  let cells = DOW_PT.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for(let i = 0; i < firstWeekday; i++){
    cells += `<div class="cal-cell pad"></div>`;
  }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${calView.year}-${pad2(calView.month + 1)}-${pad2(d)}`;
    const items = byDate[dateStr] || [];
    const status = dayStatus(items);
    const classes = ['cal-cell'];
    if(status) classes.push(status);
    if(dateStr === today) classes.push('today');
    if(dateStr === selectedDate) classes.push('selected');
    const examPassed = items.some(t => t.done && isExamTask(t));
    if(examPassed) classes.push('exam-passed');
    const countLabel = items.length ? `${items.filter(t => t.done).length}/${items.length}` : '';
    const badge = examPassed
      ? `<span class="party" title="Aprovado!">🎉</span>`
      : (countLabel ? `<span class="c">${countLabel}</span>` : '');
    cells += `<div class="${classes.join(' ')}" data-date="${dateStr}"><span class="n">${d}</span>${badge}</div>`;
  }

  const selectedItems = selectedDate ? (byDate[selectedDate] || []) : [];
  const selectedLabel = selectedDate
    ? (selectedDate === today ? `${formatDayLabel(selectedDate)} · hoje` : formatDayLabel(selectedDate))
    : '';

  const detailHtml = !selectedDate
    ? `<div class="empty">Toque num dia para ver ou adicionar itens.</div>`
    : selectedItems.length === 0
      ? `<div class="empty">Nenhum item nesse dia ainda.</div>`
      : `<div class="task-list">${selectedItems.map(t => `
          <div class="task-item">
            <div class="task-check ${t.done ? 'done' : ''}" data-id="${t.id}"></div>
            <div class="task-body">
              <div class="task-text ${t.done ? 'done' : ''}">${escapeHtml(t.description)}</div>
              ${(t.hours != null || t.pct != null) ? `
                <div class="task-meta">
                  ${t.hours != null ? `<span>${t.hours}h estudadas</span>` : ''}
                  ${t.pct != null ? `<span class="pct-badge ${pctColorClass(t.pct)}">${t.pct}% de acerto</span>` : ''}
                </div>
              ` : ''}
            </div>
            ${t.image ? `<img class="task-thumb" src="${t.image}" alt="Anexo do item">` : ''}
            <button class="task-edit" data-edit="${t.id}" aria-label="Editar">✎</button>
            <button class="task-remove" data-remove="${t.id}" aria-label="Remover">×</button>
          </div>
        `).join('')}</div>`;

  const editingTask = editingTaskId ? tasks.find(x => x.id === editingTaskId) : null;

  app.innerHTML = `
    <div class="badge-adm">Admin</div>
    ${tabsHtml()}
    <div class="eyebrow">Sprint de Estudos</div>
    <h1>${escapeHtml(config.examName)}</h1>
    <div class="countdown">${diasTexto}</div>

    <div class="card">
      <div class="progress-row">
        <span class="progress-label">Progresso</span>
        <span class="progress-value"><b>${done}</b> / ${total} concluídos</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card">
      <div class="cal-head">
        <div class="cal-nav">
          <button type="button" id="prevMonth" aria-label="Mês anterior">‹</button>
          <span class="cal-month-label">${MONTHS_PT[calView.month]} ${calView.year}</span>
          <button type="button" id="nextMonth" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal-legend">
          <span><i class="dot good"></i>completo</span>
          <span><i class="dot mid"></i>parcial</span>
          <span><i class="dot pend"></i>pendente</span>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>

      <div class="day-detail">
        <div class="day-detail-label">${selectedLabel || 'Dia'}</div>
        ${detailHtml}
      </div>
    </div>

    <div class="card">
      <div class="section-title">${editingTask ? 'Editar item' : 'Adicionar item'}</div>
      <form id="taskForm">
        <div class="field">
          <label for="taskDate">Dia</label>
          <input type="date" id="taskDate" value="${editingTask ? editingTask.date : (selectedDate || todayStr())}" />
        </div>
        <div class="field">
          <label for="taskDesc">O que foi (ou será) proposto para esse dia</label>
          <input type="text" id="taskDesc" placeholder="Ex: Revisar capítulo 3 - Redes" value="${editingTask ? escapeHtml(editingTask.description) : ''}" required />
        </div>
        <div class="field">
          <label for="taskHours">Horas estudadas (opcional)</label>
          <input type="number" id="taskHours" min="0" step="0.5" placeholder="Ex: 2" value="${editingTask && editingTask.hours != null ? editingTask.hours : ''}" />
        </div>
        <div class="field">
          <label for="taskPct">Aproveitamento (opcional)</label>
          <select id="taskPct">${pctOptionsHtml(editingTask ? editingTask.pct : null)}</select>
        </div>
        <div class="field">
          <label for="taskImage">Anexar imagem (PNG, opcional)</label>
          <input type="file" id="taskImage" accept="image/png" />
          <div id="imagePreviewWrap"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit">${editingTask ? 'Salvar alterações' : 'Adicionar'}</button>
          ${editingTask ? `<button type="button" class="ghost" id="cancelTaskEdit">Cancelar</button>` : ''}
        </div>
      </form>
    </div>

    <button class="settings-toggle" id="editSettings">Editar prova</button>
    <div class="hint">O link público (sem /adm) mostra sempre o progresso mais recente para o seu supervisor, em modo somente leitura.</div>
    <div class="error" id="dashError"></div>
  `;

  bindTabs(app);

  document.getElementById('prevMonth').onclick = () => {
    calView.month -= 1;
    if(calView.month < 0){ calView.month = 11; calView.year -= 1; }
    selectedDate = null;
    render();
  };
  document.getElementById('nextMonth').onclick = () => {
    calView.month += 1;
    if(calView.month > 11){ calView.month = 0; calView.year += 1; }
    selectedDate = null;
    render();
  };
  app.querySelectorAll('.cal-cell[data-date]').forEach(el => {
    el.onclick = () => {
      selectedDate = el.getAttribute('data-date');
      render();
    };
  });

  updateImagePreview();
  bindThumbs(app);

  document.getElementById('taskImage').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file){ pendingImageDataUrl = null; updateImagePreview(); return; }
    try{
      pendingImageDataUrl = await resizeImageFile(file, 800);
    }catch(err){
      pendingImageDataUrl = null;
      console.error('Erro ao processar imagem', err);
    }
    updateImagePreview();
  });

  if(editingTask){
    document.getElementById('cancelTaskEdit').onclick = () => {
      editingTaskId = null;
      pendingImageDataUrl = null;
      render();
    };
  }

  document.getElementById('taskForm').onsubmit = async (e) => {
    e.preventDefault();
    const date = document.getElementById('taskDate').value || todayStr();
    const description = document.getElementById('taskDesc').value.trim();
    if(!description) return;
    const hoursRaw = document.getElementById('taskHours').value;
    const pctRaw = document.getElementById('taskPct').value;
    const newTasks = clone(tasks);

    if(editingTaskId){
      const t = newTasks.find(x => x.id === editingTaskId);
      if(t){
        t.date = date;
        t.description = description;
        t.hours = hoursRaw ? Number(hoursRaw) : null;
        t.pct = pctRaw ? Number(pctRaw) : null;
        t.image = pendingImageDataUrl || null;
      }
    } else {
      newTasks.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        date,
        description,
        done: false,
        hours: hoursRaw ? Number(hoursRaw) : null,
        pct: pctRaw ? Number(pctRaw) : null,
        image: pendingImageDataUrl || null
      });
    }

    selectedDate = date;
    const ok = await persist(config, newTasks, document.getElementById('dashError'));
    if(ok){ pendingImageDataUrl = null; editingTaskId = null; }
  };

  app.querySelectorAll('[data-edit]').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-edit');
      const t = tasks.find(x => x.id === id);
      if(!t) return;
      editingTaskId = id;
      pendingImageDataUrl = t.image || null;
      render();
    };
  });

  app.querySelectorAll('.task-check[data-id]').forEach(el => {
    el.onclick = async () => {
      const id = el.getAttribute('data-id');
      const newTasks = clone(tasks);
      const t = newTasks.find(x => x.id === id);
      if(t){
        t.done = !t.done;
        await persist(config, newTasks, document.getElementById('dashError'));
      }
    };
  });

  app.querySelectorAll('[data-remove]').forEach(el => {
    el.onclick = async () => {
      const id = el.getAttribute('data-remove');
      const newTasks = clone(tasks).filter(x => x.id !== id);
      await persist(config, newTasks, document.getElementById('dashError'));
    };
  });

  document.getElementById('editSettings').onclick = () => renderEdit(app);
}

function markPdiDirty(){
  pdiDirty = true;
  const el = document.getElementById('pdiSaveState');
  if(el){ el.textContent = 'Alterações não salvas'; el.classList.add('dirty'); }
}

function pdiBlockAdminHtml(pIdx, b, blk){
  const rows = blk.items.map((it, i) => `
    <div class="pdi-item-row">
      <input type="text" data-pdi="item-text" data-p="${pIdx}" data-b="${b.key}" data-i="${i}"
             value="${escapeAttr(it.text)}" placeholder="O que será feito" />
      <input type="date" data-pdi="item-date" data-p="${pIdx}" data-b="${b.key}" data-i="${i}"
             value="${escapeAttr(it.date)}" />
      <button type="button" class="pdi-icon-btn" data-del-item="${pIdx}|${b.key}|${i}" aria-label="Remover item">×</button>
    </div>`).join('');

  return `
    <div class="pdi-block ${b.tone}">
      <div class="pdi-block-title">${b.pct} ${b.title}</div>
      <div class="pdi-block-sub">${b.sub}</div>

      <span class="pdi-sub-label">O que será feito:</span>
      ${rows}
      <button type="button" class="pdi-add" data-add-item="${pIdx}|${b.key}">+ Adicionar item</button>

      <div class="pdi-grid">
        ${PDI_TEXT_FIELDS.map(f => `
          <div>
            <span class="pdi-sub-label">${f.label}:</span>
            <textarea data-pdi="${f.key}" data-p="${pIdx}" data-b="${b.key}" placeholder="${escapeAttr(f.label)}">${escapeHtml(blk[f.key])}</textarea>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderPdi(app){
  if(!pdiDraft){
    pdiDraft = normalizePdi(state.pdi);
    // Primeira vez com o PDI vazio: já entrega os 4 formulários prontos.
    if(pdiDraft.points.length === 0){
      for(let i = 0; i < PDI_DEFAULT_POINTS; i++) pdiDraft.points.push(emptyPdiPoint());
    }
  }
  const points = pdiDraft.points;
  const allCollapsed = points.length > 0 && points.every(pt => pdiCollapsed.has(pt.id));

  const pointsHtml = points.length === 0
    ? `<div class="card"><div class="empty">Nenhum ponto a desenvolver ainda.</div></div>`
    : points.map((pt, pIdx) => {
        const collapsed = pdiCollapsed.has(pt.id);
        const preview = pt.title.trim();
        return `
        <div class="pdi-point${collapsed ? ' collapsed' : ''}">
          <div class="pdi-point-head">
            <button type="button" class="pdi-icon-btn chev" data-toggle-point="${pt.id}"
                    aria-expanded="${collapsed ? 'false' : 'true'}"
                    aria-label="${collapsed ? 'Expandir' : 'Recolher'} ponto ${pIdx + 1}">${collapsed ? '▸' : '▾'}</button>
            <div class="pdi-point-title-line" data-toggle-point="${pt.id}">
              <span class="pdi-point-label">Ponto a desenvolver ${pIdx + 1}</span>
              ${collapsed ? `<span class="pdi-point-preview">${preview ? escapeHtml(preview) : 'em branco'}</span>` : ''}
            </div>
            <button type="button" class="pdi-icon-btn" data-del-point="${pIdx}" aria-label="Remover ponto ${pIdx + 1}">×</button>
          </div>
          ${collapsed ? '' : `
            <textarea data-pdi="title" data-p="${pIdx}" rows="3" placeholder="Ex: Ponte entre Backoffice e Consultoria">${escapeHtml(pt.title)}</textarea>
            ${PDI_BLOCKS.map(b => pdiBlockAdminHtml(pIdx, b, pt.blocks[b.key])).join('')}
          `}
        </div>`;
      }).join('');

  app.innerHTML = `
    <div class="badge-adm">Admin</div>
    ${tabsHtml()}
    <div class="eyebrow">Plano de Desenvolvimento Individual</div>
    <h1>PDI</h1>
    <div class="countdown">Pontos a desenvolver no modelo <strong>70 · 20 · 10</strong>.</div>

    <div class="pdi-actions">
      <button type="button" id="addPdiPoint">+ Adicionar ponto</button>
      <button type="button" id="savePdi">Salvar PDI</button>
      ${points.length > 1 ? `<button type="button" class="ghost" id="toggleAllPdi">${allCollapsed ? 'Expandir todos' : 'Recolher todos'}</button>` : ''}
      <span class="pdi-save-state ${pdiDirty ? 'dirty' : ''}" id="pdiSaveState">${pdiDirty ? 'Alterações não salvas' : 'Tudo salvo'}</span>
    </div>

    ${pointsHtml}

    <div class="hint">O link público (sem /adm) mostra o PDI na aba PDI, em modo somente leitura.</div>
    <div class="error" id="pdiError"></div>
  `;

  bindTabs(app);
  bindPdiInputs(app);

  document.getElementById('addPdiPoint').onclick = () => {
    const pt = emptyPdiPoint();
    pdiDraft.points.push(pt);
    pdiCollapsed.delete(pt.id);
    markPdiDirty();
    render();
  };

  const toggleAll = document.getElementById('toggleAllPdi');
  if(toggleAll){
    toggleAll.onclick = () => {
      if(allCollapsed) pdiCollapsed.clear();
      else pdiDraft.points.forEach(pt => pdiCollapsed.add(pt.id));
      render();
    };
  }

  document.getElementById('savePdi').onclick = async () => {
    document.getElementById('pdiError').textContent = '';
    await persistPdi(clone(pdiDraft), document.getElementById('pdiError'));
  };
}

function bindPdiInputs(app){
  // Os campos alimentam o rascunho sem re-renderizar, para não perder o foco
  // enquanto se digita. Só mudanças de estrutura (add/remover) re-renderizam.
  const onEdit = (el) => {
    const kind = el.getAttribute('data-pdi');
    const pt = pdiDraft.points[Number(el.getAttribute('data-p'))];
    if(!pt) return;
    if(kind === 'title'){
      pt.title = el.value;
    } else {
      const blk = pt.blocks[el.getAttribute('data-b')];
      if(!blk) return;
      if(kind === 'item-text' || kind === 'item-date'){
        const it = blk.items[Number(el.getAttribute('data-i'))];
        if(!it) return;
        if(kind === 'item-text') it.text = el.value; else it.date = el.value;
      } else {
        blk[kind] = el.value;
      }
    }
    markPdiDirty();
  };

  app.querySelectorAll('[data-pdi]').forEach(el => {
    const handler = () => onEdit(el);
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });

  app.querySelectorAll('[data-add-item]').forEach(el => {
    el.onclick = () => {
      const [p, bk] = el.getAttribute('data-add-item').split('|');
      pdiDraft.points[Number(p)].blocks[bk].items.push({ id: uid(), text: '', date: '' });
      markPdiDirty();
      render();
    };
  });

  app.querySelectorAll('[data-del-item]').forEach(el => {
    el.onclick = () => {
      const [p, bk, i] = el.getAttribute('data-del-item').split('|');
      pdiDraft.points[Number(p)].blocks[bk].items.splice(Number(i), 1);
      markPdiDirty();
      render();
    };
  });

  app.querySelectorAll('[data-del-point]').forEach(el => {
    el.onclick = () => {
      const idx = Number(el.getAttribute('data-del-point'));
      if(!confirm(`Remover o ponto a desenvolver ${idx + 1}?`)) return;
      const removed = pdiDraft.points.splice(idx, 1)[0];
      if(removed) pdiCollapsed.delete(removed.id);
      markPdiDirty();
      render();
    };
  });

  // Recolher/expandir: só muda a visualização, o rascunho continua intacto.
  app.querySelectorAll('[data-toggle-point]').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-toggle-point');
      if(pdiCollapsed.has(id)) pdiCollapsed.delete(id); else pdiCollapsed.add(id);
      render();
    };
  });
}

async function load(){

    .from('cronograma_state')
    .select('config,tasks,pdi')
    .eq('id', 1)
    .single();
  if(!error && data){
    state = { config: data.config, tasks: data.tasks || [], pdi: normalizePdi(data.pdi) };
  }
  render();
}

sb.channel('cronograma_state_admin')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_state', filter: 'id=eq.1' }, (payload) => {
    if(payload.new){
      state = {
        config: payload.new.config,
        tasks: payload.new.tasks || [],
        pdi: normalizePdi(payload.new.pdi)
      };
      // Se o PDI está sendo editado com alterações pendentes, não descarta o rascunho.
      if(activeTab === 'pdi' && pdiDirty) return;
      if(activeTab === 'pdi') pdiDraft = normalizePdi(state.pdi);
      render();
    }
  })
  .subscribe();

load();
</script>
